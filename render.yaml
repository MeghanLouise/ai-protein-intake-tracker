# Render Blueprint: one web service that builds the React client and serves it with the API.
# Secret values are marked sync: false, so Render asks you for them instead of reading them from git.
services:
  - type: web
    name: protein-tracker
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      # Server secrets
      - key: GEMINI_API_KEY
        sync: false
      - key: INVITE_CODES
        sync: false
      # Path where the "service-account.json" Secret File is mounted (add the file in the dashboard)
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      # Firebase settings (public identifiers). VITE_* are baked into the client at build time.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
