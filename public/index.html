<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protein Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Protein Tracker</h1>

    <section id="progress">
      <div class="totals"><span id="total">0</span> / <span id="goal">0</span> g</div>
      <progress id="bar" value="0" max="100"></progress>
      <button id="edit-goal" type="button" class="link">Change goal</button>
    </section>

    <section id="add">
      <h2>What did you eat?</h2>
      <form id="estimate-form">
        <textarea id="text" rows="2" placeholder="e.g. two eggs and a chicken breast"></textarea>
        <label class="file">
          Or upload a photo
          <input id="photo" type="file" accept="image/*">
        </label>
        <button type="submit">Estimate protein</button>
      </form>

      <form id="confirm-form" hidden>
        <p id="breakdown"></p>
        <input id="confirm-description" type="text" required>
        <label>Protein (g) <input id="confirm-grams" type="number" min="0" step="0.1" required></label>
        <button type="submit">Save</button>
        <button type="button" id="cancel" class="link">Cancel</button>
      </form>
      <p id="status" role="status"></p>
    </section>

    <section id="log">
      <h2>Today</h2>
      <ul id="entries"></ul>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
